    <!-- Structured Data - FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Faut-il créer un compte pour utiliser le timer ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Non. Aucune inscription, aucun mot de passe, aucune carte bancaire. Vous créez un timer, vous recevez un code à six chiffres et un lien d'édition secret. C'est tout."
          }
        },
        {
          "@type": "Question",
          "name": "Comment les participants voient-ils le temps restant ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vous projetez l'affichage sur l'écran de la salle, ou vous partagez votre écran en visio. Un QR code permet aussi à chacun d'ouvrir le timer sur son téléphone."
          }
        },
        {
          "@type": "Question",
          "name": "Puis-je modifier le déroulé pendant la séance ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. Depuis la télécommande, vous ajoutez ou supprimez des séquences, changez les durées et ajoutez du temps à la volée. Tous les écrans se mettent à jour immédiatement."
          }
        },
        {
          "@type": "Question",
          "name": "Le timer fonctionne-t-il à distance et en hybride ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Oui. La synchronisation passe par le web : tous ceux qui ouvrent le lien voient le même temps, qu'ils soient dans la salle ou connectés à distance."
          }
        },
        {
          "@type": "Question",
          "name": "Combien de temps mon timer est-il conservé ?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Un timer reste accessible tant qu'il est utilisé. Les timers inactifs depuis plus de sept jours sont automatiquement supprimés."
          }
        }
      ]
    }
    </script>
